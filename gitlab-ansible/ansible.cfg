[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
timeout            = 30

# Pipelining speeds up execution by reducing SSH round-trips.
# Requires requiretty to be disabled in /etc/sudoers on the target host.
[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
