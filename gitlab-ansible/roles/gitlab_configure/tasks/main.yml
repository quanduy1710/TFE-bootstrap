---
# ---------------------------------------------------------------------------
# Role: gitlab_configure
# Renders gitlab.rb from a template and reconfigures GitLab.
# ---------------------------------------------------------------------------

- name: Render /etc/gitlab/gitlab.rb from template
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: reconfigure gitlab

- name: Flush handlers to apply configuration immediately
  ansible.builtin.meta: flush_handlers

- name: Wait for GitLab to be ready
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/-/readiness?all=1"
    method: GET
    status_code: 200
    validate_certs: "{{ gitlab_ssl_mode != 'self_signed' }}"
  register: gitlab_readiness
  retries: 30
  delay: 15
  until: gitlab_readiness.status == 200
