---
# ---------------------------------------------------------------------------
# Playbook: install.yml
# Installs and configures a self-hosted GitLab instance on an EC2 instance.
#
# Usage:
#   ansible-playbook playbooks/install.yml \
#     -i inventory/hosts.yml \
#     --ask-vault-pass          # if using Ansible Vault for secrets
# ---------------------------------------------------------------------------
- name: Install and configure self-hosted GitLab on EC2
  hosts: localhost
  become: true
  gather_facts: true

  # Load the GitLab config explicitly so the playbook works regardless of how
  # the inventory is resolved (a group-less implicit localhost would otherwise
  # never pick up inventory/group_vars/gitlab.yml). Path is relative to this file.
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/gitlab.yml"

  # Export the proxy to every task so the host can reach the internet from
  # behind the corporate proxy (apt, get_url, the GitLab repo setup script).
  # Equivalent to `export http_proxy=... https_proxy=...` before the run.
  # proxy_env is defined in inventory/group_vars/gitlab.yml; defaults to {}
  # (no proxy) when unset. Task-level environment (e.g. EXTERNAL_URL) merges
  # on top of this. It survives become — Ansible injects the vars into the
  # final command, so sudo env_reset does not strip them.
  environment: "{{ proxy_env | default({}) }}"

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_pkg_mgr == 'apt'

    - name: Set system timezone to UTC
      community.general.timezone:
        name: UTC

  roles:
    - role: gitlab_install
    - role: gitlab_configure

  post_tasks:
    - name: Print GitLab initial root password location
      ansible.builtin.debug:
        msg: >
          GitLab installed successfully.
          Initial root password: /etc/gitlab/initial_root_password
          (deleted after 24 hours — change it immediately).
          External URL: {{ gitlab_external_url }}
